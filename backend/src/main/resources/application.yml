spring:
  application:
    name: registration-service

  config:
    # Load backend/.env for local development, as a properties file.
    #
    # Spring Boot does not read .env on its own: it is an environment file, and
    # nothing puts it into the JVM's environment. `mvnw spring-boot:run` in a clean
    # shell therefore saw no DB_PASSWORD and fell through to the empty default
    # below, which Postgres rejects with "the server requested SCRAM-based
    # authentication, but no password was provided". docker-compose auto-loads the
    # same file, so the container and the application now read one set of values.
    #
    # `optional:` is what keeps this local-only. Nothing else changes: the deployed
    # image copies just the jar, so there is no .env beside it and the platform's
    # real environment variables win as before. Environment variables also outrank
    # an imported file, so exporting DB_PASSWORD still overrides it.
    import: optional:file:.env[.properties]

  datasource:
    # Credentials come from the environment. Nothing secret is committed.
    url: ${DB_URL:jdbc:postgresql://localhost:55432/engineers_day}
    username: ${DB_USERNAME:engineers_day}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: registration-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # A registration that cannot get a connection should fail fast and be retried,
      # not hold a browser open for half a minute.
      connection-timeout: 5000

  jpa:
    # Flyway owns the schema. Hibernate must never create, alter or drop it - a schema
    # invented at boot would silently drop the CHECK constraints that make overselling
    # impossible, and those constraints are load-bearing.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        format_sql: true
    show-sql: ${SHOW_SQL:false}

  flyway:
    enabled: true
    locations: classpath:db/migration

    # A managed Postgres provider hands over a `public` schema that is already
    # non-empty - Supabase, for one, installs its own objects there before the
    # application ever connects. Flyway reads "non-empty schema, no history table"
    # as a database someone else already owns and refuses to touch it:
    #
    #   Found non-empty schema(s) "public" but no schema history table.
    #
    # Baselining on migrate tells it to write the history table and carry on.
    baseline-on-migrate: true

    # The version matters as much as the flag, and 0 is the whole point.
    #
    # Flyway skips every migration at or below the baseline version. Left at its
    # default of 1, baselining would mark V1 as already applied and start from V2 -
    # seeding events into tables that were never created. At 0, nothing is skipped
    # and V1 through V5 all run in order.
    #
    # It also keeps the dangerous case loud. If this ever points at a database that
    # genuinely does hold application tables, V1 fails on "relation already exists"
    # rather than silently baselining over data and leaving a half-built schema.
    baseline-version: 0
    baseline-description: "Pre-existing schema (provider-managed objects)"

server:
  port: ${SERVER_PORT:8080}
  error:
    # Errors are rendered by GlobalExceptionHandler in one consistent shape; the servlet
    # container's default page would leak stack traces and break that contract.
    include-message: never
    include-stacktrace: never

app:
  # The single operations account. There is deliberately NO default password: with
  # none set, no admin user exists and every /api/admin/** call is refused. A
  # fallback credential is the thing that reaches production by accident.
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}

  arena:
    # EMERGENCY MANUAL-EVALUATION MODE.
    #
    # false switches off live code execution for the whole event: /run and the
    # per-problem /submit are refused server-side, and the arena becomes
    # edit -> autosave -> submit mission -> manual review by organisers.
    #
    # This is a switch, not a deletion. The Judge0 engine, its language mapping and
    # the output comparator are all present and still tested; set this back to true
    # once the execution path is trusted again.
    #
    # The participant UI offers no way to reach those endpoints either, but the
    # server refusing them is what makes it a fact rather than a hidden button.
    execution-enabled: ${ARENA_EXECUTION_ENABLED:false}

  # The self-hosted Judge0 that runs participant code.
  #
  # Reachable from the BACKEND ONLY. The browser never receives this URL and never
  # talks to the judge: every execution goes through /api/arena/problems/{ref}/run,
  # which authorises it first. Exposing Judge0 to the internet would be an open
  # remote code execution service.
  #
  # The limits below are attached to every submission by Judge0ExecutionEngine and
  # cannot be influenced by a request. They match the locked architecture: 2s CPU,
  # 256 MB, 64 KB of captured output. The wall limit is looser than the CPU limit on
  # purpose - it is what catches a program blocked on input rather than burning CPU,
  # and it has to leave room for JVM start-up on the Java problems.
  judge0:
    base-url: ${JUDGE0_BASE_URL:http://localhost:2358}
    # Only needed if the deployment enables authentication.
    auth-token: ${JUDGE0_AUTH_TOKEN:}
    cpu-time-limit-seconds: ${JUDGE0_CPU_SECONDS:2}
    wall-time-limit-seconds: ${JUDGE0_WALL_SECONDS:10}
    memory-limit-kb: ${JUDGE0_MEMORY_KB:262144}
    max-output-chars: ${JUDGE0_MAX_OUTPUT:65536}
    connect-timeout-ms: 3000
    # Per-call backstop only. Under the async flow no single call waits for a
    # verdict, so anything slower than this is a wedged socket.
    read-timeout-ms: ${JUDGE0_READ_TIMEOUT_MS:10000}

    # Submissions are created with wait=false and then polled. The budget - not an
    # HTTP timeout - is what bounds how long one request can occupy a Tomcat thread
    # when the judge never resolves a submission.
    poll-interval-ms: ${JUDGE0_POLL_INTERVAL_MS:150}
    max-poll-interval-ms: ${JUDGE0_MAX_POLL_INTERVAL_MS:750}
    poll-budget-ms: ${JUDGE0_POLL_BUDGET_MS:25000}

  # Browser origins allowed to call this API. Never a wildcard - see WebCorsConfig.
  #
  # The default carries the deployed frontend and the two Vite dev ports, so a fresh
  # deployment works before anyone sets an environment variable. CORS_ALLOWED_ORIGINS
  # REPLACES this list rather than adding to it: an override for a new frontend origin
  # must repeat any dev origins it still wants.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://engineers-day-registration.vercel.app,http://localhost:5173,http://localhost:3000}

logging:
  level:
    in.mittechkernel.registration: ${LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
